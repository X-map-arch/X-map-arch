<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Filters for Lightning Glow -->
  <defs>
    <filter id="electric" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Shadow for Text -->
  <text x="380" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#000000" text-anchor="end" letter-spacing="1" opacity="0.8">X-map-</text>
  <text x="390" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#000000" text-anchor="start" letter-spacing="1" opacity="0.8">arch</text>

  <!-- Main Text: X-map- (White) -->
  <text x="380" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">X-map-</text>
  
  <!-- Main Text: arch (Gold/Yellow) -->
  <text x="390" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#FFD700" text-anchor="start" letter-spacing="1">arch</text>

  <!-- Subtitle -->
  <text x="450" y="165" font-family="'Fira Code', monospace" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="8">PHANTOM IN THE SYSTEM</text>

  <!-- REALISTIC LEFT TO RIGHT LIGHTNING (Your Provided Code) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 40)">
    
    <!-- Outer Electric Blue Glow -->
    <path
      d="M -15 65 L 35 57 L 58 65 L 82 47 L 105 64 L 130 54 L 155 68 L 181 43 L 204 61 L 228 53 L 253 68 L 278 45 L 300 63 L 324 50 L 348 68 L 373 42 L 397 61 L 421 51 L 446 68 L 470 43 L 494 62 L 518 49 L 542 68 L 566 42 L 590 62 L 615 51 L 640 68 L 664 43 L 689 62 L 713 50 L 743 65"
      pathLength="1000"
      stroke="#56aaff"
      stroke-width="11"
      opacity="0"
      stroke-dasharray="1000"
      stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.64;0.78;1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.76;1" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <!-- Strong White Electric Glow -->
    <path
      d="M -15 65 L 35 57 L 58 65 L 82 47 L 105 64 L 130 54 L 155 68 L 181 43 L 204 61 L 228 53 L 253 68 L 278 45 L 300 63 L 324 50 L 348 68 L 373 42 L 397 61 L 421 51 L 446 68 L 470 43 L 494 62 L 518 49 L 542 68 L 566 42 L 590 62 L 615 51 L 640 68 L 664 43 L 689 62 L 713 50 L 743 65"
      pathLength="1000"
      stroke="#ffffff"
      stroke-width="5"
      opacity="0"
      stroke-dasharray="1000"
      stroke-dashoffset="1000"
      filter="url(#electric)">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.64;0.78;1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.76;1" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <!-- Bright Electric Core -->
    <path
      d="M -15 65 L 35 57 L 58 65 L 82 47 L 105 64 L 130 54 L 155 68 L 181 43 L 204 61 L 228 53 L 253 68 L 278 45 L 300 63 L 324 50 L 348 68 L 373 42 L 397 61 L 421 51 L 446 68 L 470 43 L 494 62 L 518 49 L 542 68 L 566 42 L 590 62 L 615 51 L 640 68 L 664 43 L 689 62 L 713 50 L 743 65"
      pathLength="1000"
      stroke="#ffffff"
      stroke-width="1.8"
      opacity="0"
      stroke-dasharray="1000"
      stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.64;0.78;1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.76;1" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <!-- Lightning Branches -->
    <g stroke="#ffffff" stroke-width="2" filter="url(#electric)" opacity="0">
      <path d="M 82 47 L 74 27 L 90 16 M 155 68 L 144 87 L 157 103 M 278 45 L 269 24 L 286 13 M 373 42 L 359 20 L 377 8 M 470 43 L 483 23 L 474 12 M 566 42 L 555 21 L 570 10 M 664 43 L 677 23 L 668 12"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.64;0.78;1" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
