<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 100% Solid Dark Background -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Drop Shadow/Glow for the Text (3D Effect) -->
  <text x="380" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#000000" text-anchor="end" letter-spacing="1" opacity="0.8">X-map-</text>
  <text x="390" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#000000" text-anchor="start" letter-spacing="1" opacity="0.8">arch</text>

  <!-- Main Text: X-map- (White) -->
  <text x="380" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">X-map-</text>
  
  <!-- Main Text: arch (Gold/Yellow) -->
  <text x="390" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="80" font-weight="900" fill="#FFD700" text-anchor="start" letter-spacing="1">arch</text>

  <!-- Subtitle (Clean and Bright) -->
  <text x="450" y="165" font-family="'Fira Code', monospace" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="8">PHANTOM IN THE SYSTEM</text>

  <!-- Animated Lightning Passing THROUGH the text -->
  <g>
    <!-- Lightning shape with a blur glow -->
    <polygon points="450,0 420,70 480,80 410,180 430,130 380,220" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.65;0.7;0.75;1" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="-400,0; 400,0" dur="4s" repeatCount="indefinite" />
    </polygon>
    
    <!-- Extra sharp yellow lightning bolt for intensity -->
    <polygon points="450,0 410,80 460,90 400,200" fill="#FFD700" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0.8;0;0" keyTimes="0;0.6;0.65;0.7;0.75;1" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="-400,0; 400,0" dur="4s" repeatCount="indefinite" />
    </polygon>

    <!-- Flash effect over the whole banner -->
    <rect width="100%" height="100%" fill="#FFD700" opacity="0" style="mix-blend-mode: overlay;">
      <animate attributeName="opacity" values="0;0;0.15;0.15;0;0" keyTimes="0;0.6;0.65;0.7;0.75;1" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
