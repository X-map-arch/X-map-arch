<svg width="100%" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid Dark -->
  <rect x="0" y="0" width="900" height="200" fill="#0d1117" />

  <!-- Text: X-map- (White) -->
  <text x="400" y="115" font-family="'Segoe UI', sans-serif" font-size="70" font-weight="bold" fill="#ffffff" text-anchor="end" letter-spacing="1">X-map-</text>
  
  <!-- Text: arch (Golden Yellow) -->
  <text x="410" y="115" font-family="'Segoe UI', sans-serif" font-size="70" font-weight="bold" fill="#FFD700" text-anchor="start" letter-spacing="1">arch</text>

  <!-- Subtitle: PHANTOM IN THE SYSTEM -->
  <text x="450" y="160" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="6">PHANTOM IN THE SYSTEM</text>

  <!-- Animated Lightning Strike (Passes through text) -->
  <g>
    <!-- The Lightning Shape -->
    <polygon points="450,0 420,60 470,70 400,200" fill="#ffffff" opacity="0">
      <!-- Animation: Moves across and flashes -->
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.85;0.9;1" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="-300,0; 300,0" dur="4s" repeatCount="indefinite" />
    </polygon>
    
    <!-- Glowing Flash Effect on the text -->
    <rect x="0" y="0" width="900" height="200" fill="#FFD700" opacity="0" style="mix-blend-mode: overlay;">
      <animate attributeName="opacity" values="0;0;0.4;0;0" keyTimes="0;0.8;0.85;0.9;1" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
