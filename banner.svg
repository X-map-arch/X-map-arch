<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 100% Solid Dark Background -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Main Text: X-map- (White, Bold) -->
  <text x="380" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="75" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">X-map-</text>
  
  <!-- Main Text: arch (Gold/Yellow, Bold) -->
  <text x="390" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="75" font-weight="900" fill="#FFD700" text-anchor="start" letter-spacing="1">arch</text>

  <!-- Subtitle -->
  <text x="450" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="8">PHANTOM IN THE SYSTEM</text>

  <!-- Animated Lightning Strike -->
  <g>
    <!-- Lightning Bolt Shape -->
    <polygon points="450,0 400,80 470,90 380,220" fill="#ffffff" opacity="0">
      <!-- Moves from left to right and flashes -->
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.7;0.75;0.8;1" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="-400,0; 400,0" dur="3s" repeatCount="indefinite" />
    </polygon>
    
    <!-- Subtle Yellow Flash Effect over the whole banner -->
    <rect width="100%" height="100%" fill="#FFD700" opacity="0" style="mix-blend-mode: screen;">
      <animate attributeName="opacity" values="0;0;0.2;0;0" keyTimes="0;0.7;0.75;0.8;1" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
