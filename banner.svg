<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100"
     viewBox="0 0 728 100" preserveAspectRatio="xMidYMid meet">

<defs>
 <!-- OBSIDIAN BLACK BACKGROUND -->
 <radialGradient id="bg" cx="48%" cy="40%" r="85%">
   <stop stop-color="#11151a"/>
   <stop offset=".55" stop-color="#050608"/>
   <stop offset="1" stop-color="#000"/>
 </radialGradient>

 <!-- METALLIC SILVER -->
 <linearGradient id="silver" x2=".15" y2="1">
   <stop stop-color="#fff"/>
   <stop offset=".2" stop-color="#cbd0d7"/>
   <stop offset=".35" stop-color="#f9fbff"/>
   <stop offset=".55" stop-color="#777f89"/>
   <stop offset=".75" stop-color="#e9edf2"/>
   <stop offset="1" stop-color="#737b85"/>
 </linearGradient>

 <!-- METALLIC GOLD -->
 <linearGradient id="gold" x2=".1" y2="1">
   <stop stop-color="#fff0a6"/>
   <stop offset=".2" stop-color="#d9ad32"/>
   <stop offset=".35" stop-color="#ffe36b"/>
   <stop offset=".55" stop-color="#966800"/>
   <stop offset=".78" stop-color="#e7b92f"/>
   <stop offset="1" stop-color="#684400"/>
 </linearGradient>

 <!-- ELECTRIC GLOW -->
 <filter id="glow" x="-30%" y="-200%" width="160%" height="500%">
   <feGaussianBlur stdDeviation="3" result="b"/>
   <feMerge>
     <feMergeNode in="b"/>
     <feMergeNode in="SourceGraphic"/>
   </feMerge>
 </filter>

 <clipPath id="clip">
   <rect width="728" height="100"/>
 </clipPath>
</defs>

<g clip-path="url(#clip)">
 <!-- BACKGROUND -->
 <rect width="728" height="100" fill="url(#bg)"/>

 <!-- SUBTLE OBSIDIAN CRACKS -->
 <g fill="none" stroke="#414951" stroke-width=".7" opacity=".2">
   <path d="M0 15L35 19 48 13 70 24 91 20 M650 9L668 17 683 12 706 26 728 21 M0 85L23 78 39 87 58 81 M660 89L679 80 696 86 728 75"/>
 </g>

 <!-- TEXT SHADOW -->
 <g font-family="Segoe UI,Arial,sans-serif" font-weight="900" filter="url(#glow)">
   <text x="15" y="75" font-size="85" fill="#000" textLength="405" lengthAdjust="spacingAndGlyphs">X-map-</text>
   <text x="428" y="75" font-size="85" fill="#000" textLength="240" lengthAdjust="spacingAndGlyphs">arch</text>
 </g>

 <!-- SILVER TEXT -->
 <g font-family="Segoe UI,Arial,sans-serif" font-weight="900">
   <text x="12" y="73" font-size="85" fill="url(#silver)" stroke="#dce2e9" stroke-width=".45" textLength="405" lengthAdjust="spacingAndGlyphs">X-map-</text>
   <!-- GOLD TEXT -->
   <text x="425" y="73" font-size="85" fill="url(#gold)" stroke="#d9ae3b" stroke-width=".45" textLength="240" lengthAdjust="spacingAndGlyphs">arch</text>
 </g>

 <!-- LEFT TO RIGHT REALISTIC LIGHTNING -->
 <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
   <!-- OUTER ELECTRIC BLUE GLOW -->
   <path id="bolt" d="M-15 45 L35 40 58 45 82 33 105 44 130 38 155 48 181 30 204 43 228 38 253 48 278 32 300 44 324 35 348 48 373 30 397 43 421 36 446 48 470 30 494 44 518 35 542 48 566 30 590 43 615 36 640 48 664 30 689 43 713 35 743 45" stroke="#58aaff" stroke-width="8" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0">
     <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;.64;.78;1" dur="4.5s" repeatCount="indefinite"/>
     <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.78;1" dur="4.5s" repeatCount="indefinite"/>
   </path>

   <!-- BRIGHT WHITE LIGHTNING -->
   <path d="M-15 45 L35 40 58 45 82 33 105 44 130 38 155 48 181 30 204 43 228 38 253 48 278 32 300 44 324 35 348 48 373 30 397 43 421 36 446 48 470 30 494 44 518 35 542 48 566 30 590 43 615 36 640 48 664 30 689 43 713 35 743 45" stroke="#fff" stroke-width="2.5" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="0">
     <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;.64;.78;1" dur="4.5s" repeatCount="indefinite"/>
     <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.78;1" dur="4.5s" repeatCount="indefinite"/>
   </path>

   <!-- LIGHTNING BRANCHES -->
   <g stroke="#fff" stroke-width="1.5" opacity="0">
     <path d="M82 33L74 18 90 10 M155 48L144 65 157 75 M278 32L269 16 286 8 M373 30L359 14 377 6 M470 30L483 15 474 8 M566 30L555 14 570 6 M664 30L677 16 668 8"/>
     <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.08;.64;.78;1" dur="4.5s" repeatCount="indefinite"/>
   </g>
 </g>

 <!-- ELECTRIC FLASH AT THE END -->
 <rect width="728" height="100" fill="#fff" opacity="0">
   <animate attributeName="opacity" values="0;0;0.12;0;0" keyTimes="0;.64;.67;.71;1" dur="4.5s" repeatCount="indefinite"/>
 </rect>
</g>
</svg>
