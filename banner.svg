<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Dark Background -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Text: X-map- (White) -->
  <text x="380" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="75" font-weight="900" fill="#ffffff" text-anchor="end" letter-spacing="1">X-map-</text>
  
  <!-- Text: arch (Gold/Yellow) -->
  <text x="390" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="75" font-weight="900" fill="#FFD700" text-anchor="start" letter-spacing="1">arch</text>

  <!-- Subtitle -->
  <text x="450" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" letter-spacing="6">PHANTOM IN THE SYSTEM</text>

  <!-- Animated Lightning Strike -->
  <g>
    <polygon points="450,0 400,80 470,90 380,220" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.85;0.9;1" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="-400,0; 400,0" dur="4s" repeatCount="indefinite" />
    </polygon>
    
    <rect width="100%" height="100%" fill="#FFD700" opacity="0" style="mix-blend-mode: screen;">
      <animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.8;0.85;0.9;1" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
